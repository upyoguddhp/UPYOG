# Upstream's default (8091) collides with egov-accesscontrol in this
# workspace. The fork's own previous default was 8093, which itself
# collides with two other not-yet-migrated services (egov-searcher,
# ws-calculator) - not fixed here since only one direct, active collision
# exists right now; see .upyog-env/egov-url-shortening.env for the local
# override actually used.
server.port = 8093
server.contextPath=/egov-url-shortening
server.context-path=/egov-url-shortening
server.servlet.context-path=/egov-url-shortening

spring.redis.host=localhost
spring.redis.port=6379

app.timezone=UTC

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://ab704f81a9d55414388e01cf80e0de51-100465108.ap-south-1.elb.amazonaws.com:5432/hpupyog_5
spring.datasource.username=postgres
spring.datasource.password=postgres123$

#----------------------------- FLYWAY CONFIGURATIONS ------------------------------#
spring.flyway.url=jdbc:postgresql://ab704f81a9d55414388e01cf80e0de51-100465108.ap-south-1.elb.amazonaws.com:5432/hpupyog_5
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=public
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

# KAFKA SERVER CONFIGURATIONS
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=egov-url-shortening
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.missing-topics-fatal = false


# KAFKA CONSUMER CONFIGURATIONS

kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest

# KAFKA PRODUCER CONFIGURATIONS

kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

url.shorten.indexer.topic=save-url-shortening-deatils

db.persistance.enabled=true

# HP's real production citizen-facing domain - used to build the actual
# shortened URLs handed back to citizens (e.g. in SMS links).
host.name=https://citizenseva.hp.gov.in/
egov.user.host=http://localhost:8081/
egov.user.search.path=user/_search
state.level.tenant.id=hp

hashids.salt=randomsalt
hsahids.min.length=3