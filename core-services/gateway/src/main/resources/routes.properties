# mdms-v2's own context-path is now /egov-mdms-service (see the cutover note on
# that route above), so calls to the old /mdms-v2/** path need rewriting to match.
spring.cloud.gateway.routes[106].id=mdms-v2
spring.cloud.gateway.routes[106].uri=http://localhost:9080/
spring.cloud.gateway.routes[106].predicates[0]=Path=/mdms-v2/**
spring.cloud.gateway.routes[106].filters[0].name=RewritePath
spring.cloud.gateway.routes[106].filters[0].args.regexp=/mdms-v2/(?<segment>.*)
spring.cloud.gateway.routes[106].filters[0].args.replacement=/egov-mdms-service/${segment}

