server.port=8095
server.servlet.context-path=/finance-dashboard

# Read-only access to the database that holds the per-ULB finance schemas.
# Use a read-only (replica) user: this service never writes.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/hp_udd_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.read-only=true

# Schemas that are not ULBs. Every other schema holding bankaccount + egcl_collectionheader is treated as a ULB.
finance.dashboard.excluded-schemas=public,generic,information_schema,pg_catalog
# Schemas are queried in parallel; keep this <= the pool size.
finance.dashboard.parallelism=8
# Summary is cached per financial year so repeated page loads do not scan every schema.
finance.dashboard.cache-ttl-seconds=600
# Voucher status that means cancelled in egov-finance.
finance.dashboard.voucher-cancelled-status=4
